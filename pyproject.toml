[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dartkv"
version = "0.1.0"
description = "A readable PyTorch reference implementation for compressed KV caches."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.4,<2.14",
]
authors = [
    { name = "DartKV contributors" },
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
dartkv-demo = "dart.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
